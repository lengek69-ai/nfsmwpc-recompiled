name: Build Android APKs

on:
  workflow_dispatch:
    inputs:
      original_binaries_url:
        description: "HTTPS URL to a ZIP containing the original speed.exe, server.dll and d3dx9_26.dll"
        required: true
        type: string
      abk_inputs_url:
        description: "HTTPS URL to a ZIP containing analysis.dll, seeds.json and blocks.c from scripts/abk_module.py"
        required: true
        type: string
      abi:
        description: "Android ABI to build"
        required: true
        type: choice
        options:
          - arm64-v8a
          - armeabi-v7a
          - both
        default: arm64-v8a

permissions:
  contents: read

concurrency:
  group: android-apk-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.abi }} APK
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        abi: ${{ inputs.abi == 'both' && fromJSON('["arm64-v8a", "armeabi-v7a"]') || fromJSON(format('["{0}"]', inputs.abi)) }}

    steps:
      - name: Checkout Most Wanted
        uses: actions/checkout@v4
        with:
          path: nfsmw

      - name: Checkout pcrecomp
        uses: actions/checkout@v4
        with:
          repository: sp00nznet/pcrecomp
          path: pcrecomp

      - name: Checkout shared NFSU2 Android infrastructure
        uses: actions/checkout@v4
        with:
          repository: codepdbh/nfsu2-recompiled
          path: nfsu2-recompiled

      - name: Checkout pinned DXVK native source
        uses: actions/checkout@v4
        with:
          repository: Joshua-Ashton/dxvk-native
          ref: c8dc91fabd00cac11d697ccf07426e798393cd40
          path: dxvk-native

      - name: Download original game binaries and prepare Python tools
        env:
          BINARIES_URL: ${{ inputs.original_binaries_url }}
          BINARIES_TOKEN: ${{ secrets.ANDROID_BUILD_INPUTS_TOKEN }}
        run: |
          set -euo pipefail
          case "$BINARIES_URL" in
            https://*) ;;
            *) echo "::error::original_binaries_url must use HTTPS"; exit 1 ;;
          esac
          if [ -n "${BINARIES_TOKEN:-}" ]; then
            curl --fail --location --retry 3 --retry-delay 2 \
              -H "Authorization: Bearer $BINARIES_TOKEN" \
              "$BINARIES_URL" -o original-binaries.zip
          else
            curl --fail --location --retry 3 --retry-delay 2 \
              "$BINARIES_URL" -o original-binaries.zip
          fi
          unzip -q original-binaries.zip -d original-binaries

          speed_exe="$(find original-binaries -type f -iname speed.exe -print -quit)"
          server_dll="$(find original-binaries -type f -iname server.dll -print -quit)"
          d3dx_dll="$(find original-binaries -type f -iname d3dx9_26.dll -print -quit)"
          for input in "$speed_exe" "$server_dll" "$d3dx_dll"; do
            if [ -z "$input" ] || [ ! -s "$input" ]; then
              echo "::error::Original binary ZIP must contain non-empty speed.exe, server.dll and d3dx9_26.dll"
              exit 1
            fi
          done

          speed_exe="$(realpath "$speed_exe")"
          server_dll="$(realpath "$server_dll")"
          d3dx_dll="$(realpath "$d3dx_dll")"

          expected_speed_sha="80774c2e5d619b4f120b48d4462896fd504c263399d203a238769cffde1d253c"
          actual_speed_sha="$(sha256sum "$speed_exe" | cut -d' ' -f1)"
          if [ "$actual_speed_sha" != "$expected_speed_sha" ]; then
            echo "::error::speed.exe does not match the repository reference executable"
            exit 1
          fi

          python3 -m venv "$RUNNER_TEMP/nfsmw-lift-venv"
          nfsmw_python="$RUNNER_TEMP/nfsmw-lift-venv/bin/python"
          "$nfsmw_python" -m pip install --disable-pip-version-check capstone pefile
          "$nfsmw_python" - "$server_dll" "$d3dx_dll" <<'PY'
          import pefile
          import sys

          expected = {
              sys.argv[1]: ("server.dll", 0x10000000, 0x0006F000),
              sys.argv[2]: ("d3dx9_26.dll", 0x00400000, 0x0024A000),
          }
          for path, (name, image_base, image_size) in expected.items():
              pe = pefile.PE(path)
              if pe.FILE_HEADER.Machine != 0x14C or pe.OPTIONAL_HEADER.Magic != 0x10B:
                  raise SystemExit(f"{name}: expected x86 PE32")
              if not pe.FILE_HEADER.Characteristics & 0x2000:
                  raise SystemExit(f"{name}: expected a DLL")
              if pe.OPTIONAL_HEADER.ImageBase != image_base:
                  raise SystemExit(f"{name}: unexpected preferred image base")
              if pe.OPTIONAL_HEADER.SizeOfImage != image_size:
                  raise SystemExit(f"{name}: unexpected SizeOfImage")
              if not getattr(pe, "DIRECTORY_ENTRY_BASERELOC", None):
                  raise SystemExit(f"{name}: base relocations are required")
              print(f"Validated {name}: base=0x{image_base:08x}, image_size=0x{image_size:x}")
          PY

          {
            echo "NFSMW_SPEED_EXE=$speed_exe"
            echo "NFSMW_SERVER_DLL=$server_dll"
            echo "NFSMW_D3DX_DLL=$d3dx_dll"
            echo "NFSMW_PYTHON=$nfsmw_python"
          } >> "$GITHUB_ENV"

      - name: Generate main executable, server and D3DX recompilation sources
        working-directory: nfsmw
        run: |
          set -euo pipefail
          PY="$NFSMW_PYTHON"
          mkdir -p work/d3dx

          echo "== Analyze speed.exe =="
          "$PY" scripts/analyze_binary.py "$NFSMW_SPEED_EXE" work

          echo "== Discover data-pointer function seeds =="
          "$PY" scripts/data_seeds.py work/speed.analysis.exe work/seeds_data.json

          echo "== Build preliminary catalog for switch/code-immediate discovery =="
          "$PY" scripts/run_lift.py catalog \
            work/speed.analysis.exe work/seeds_data.json work/catalog_data.json

          echo "== Discover switch arms and code-address immediates =="
          "$PY" scripts/code_seeds.py \
            work/speed.analysis.exe work/catalog_data.json work/seeds_code.json \
            --merge work/seeds_data.json

          echo "== Build final speed.exe catalog and lift =="
          "$PY" scripts/run_lift.py catalog \
            work/speed.analysis.exe work/seeds_code.json work/catalog.json
          "$PY" scripts/run_lift.py lift \
            work/speed.analysis.exe work/catalog.json src/recomp/gen

          echo "== Prepare and lift server.dll =="
          "$PY" scripts/prepare_server.py "$NFSMW_SERVER_DLL"

          echo "== Prepare and lift d3dx9_26.dll =="
          "$PY" scripts/prepare_module.py \
            "$NFSMW_D3DX_DLL" 0x00b00000 \
            work/d3dx/d3dx-relocated.dll work/d3dx/seeds.json
          "$PY" scripts/run_lift.py catalog \
            work/d3dx/d3dx-relocated.dll work/d3dx/seeds.json \
            work/d3dx/catalog.json --seeds-only
          "$PY" scripts/run_lift.py lift \
            work/d3dx/d3dx-relocated.dll work/d3dx/catalog.json \
            src/recomp/gen_d3dx --prefix d3dx_

          echo "== Verify generated source sets =="
          test -s src/recomp/gen/recomp_funcs.h
          test -s src/recomp/gen/recomp_dispatch.c
          compgen -G 'src/recomp/gen/recomp_*.c' >/dev/null
          test -s src/recomp/gen_server/server_recomp_funcs.h
          test -s src/recomp/gen_server/server_recomp_dispatch.c
          compgen -G 'src/recomp/gen_server/server_recomp_*.c' >/dev/null
          test -s src/recomp/gen_d3dx/d3dx_recomp_funcs.h
          test -s src/recomp/gen_d3dx/d3dx_recomp_dispatch.c
          compgen -G 'src/recomp/gen_d3dx/d3dx_recomp_*.c' >/dev/null
          echo "All three recompilation source sets were generated."

      - name: Generate lifted ABK sound-bank module
        env:
          ABK_INPUTS_URL: ${{ inputs.abk_inputs_url }}
          ABK_INPUTS_TOKEN: ${{ secrets.ANDROID_BUILD_INPUTS_TOKEN }}
        run: |
          set -euo pipefail
          case "$ABK_INPUTS_URL" in
            https://*) ;;
            *) echo "::error::abk_inputs_url must use HTTPS"; exit 1 ;;
          esac
          if [ -n "${ABK_INPUTS_TOKEN:-}" ]; then
            curl --fail --location --retry 3 --retry-delay 2 \
              -H "Authorization: Bearer $ABK_INPUTS_TOKEN" \
              "$ABK_INPUTS_URL" -o abk-inputs.zip
          else
            curl --fail --location --retry 3 --retry-delay 2 \
              "$ABK_INPUTS_URL" -o abk-inputs.zip
          fi
          unzip -q abk-inputs.zip -d abk-inputs

          analysis_dll="$(find abk-inputs -type f -name analysis.dll -print -quit)"
          seeds_json="$(find abk-inputs -type f -name seeds.json -print -quit)"
          blocks_c="$(find abk-inputs -type f -name blocks.c -print -quit)"
          for input in "$analysis_dll" "$seeds_json" "$blocks_c"; do
            if [ -z "$input" ] || [ ! -s "$input" ]; then
              echo "::error::ABK input ZIP must contain non-empty analysis.dll, seeds.json and blocks.c"
              exit 1
            fi
          done

          mkdir -p nfsmw/work/abk nfsmw/src/recomp/gen_abk
          cp "$blocks_c" nfsmw/src/recomp/gen_abk/abk_blocks.c

          python3 -m venv "$RUNNER_TEMP/abk-lift-venv"
          ABK_PY="$RUNNER_TEMP/abk-lift-venv/bin/python"
          "$ABK_PY" -m pip install --disable-pip-version-check capstone pefile
          "$ABK_PY" nfsmw/scripts/run_lift.py catalog \
            "$analysis_dll" "$seeds_json" nfsmw/work/abk/catalog.json
          "$ABK_PY" nfsmw/scripts/run_lift.py lift \
            "$analysis_dll" nfsmw/work/abk/catalog.json nfsmw/src/recomp/gen_abk \
            --prefix abk_
          test -s nfsmw/src/recomp/gen_abk/abk_recomp_funcs.h
          test -s nfsmw/src/recomp/gen_abk/abk_recomp_dispatch.c
          test -s nfsmw/src/recomp/gen_abk/abk_blocks.c
          compgen -G 'nfsmw/src/recomp/gen_abk/abk_recomp_*.c' >/dev/null

      - name: Prepare shared DXVK Android backend
        working-directory: nfsu2-recompiled
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y glslang-tools spirv-tools
          python3 ports/dxvk_android/prepare.py ../dxvk-native build/dxvk-source
          python3 ports/dxvk_android/shaders.py build/dxvk-source

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3

      - name: Install pinned Android toolchains
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.30.5"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Verify native build prerequisites
        working-directory: nfsmw
        run: |
          set -euo pipefail
          test -f ../pcrecomp/runtime/recomp32/recomp_types.h || {
            echo "::error::The checked-out pcrecomp tree does not contain runtime/recomp32/recomp.h"
            exit 1
          }
          test -d ../nfsu2-recompiled/build/dxvk-source || {
            echo "::error::nfsu2-recompiled/build/dxvk-source is missing. The shared DXVK Android source must be prepared before this build."
            exit 1
          }
          test -d ../nfsu2-recompiled/ports/dxvk_android
          test -d ../nfsu2-recompiled/third_party/libadrenotools

      - name: Build APK
        working-directory: nfsmw/android
        run: |
          set -euo pipefail
          bash ./gradlew --no-daemon --stacktrace \
            -PnfsAbi="${{ matrix.abi }}" \
            :app:assembleDebug

      - name: Stage APK
        working-directory: nfsmw/android
        run: |
          set -euo pipefail
          mkdir -p "../../dist"
          find app/build/outputs/apk -type f -name '*.apk' -exec cp {} "../../dist/NFSMWPC-AndroidEvolved-${{ matrix.abi }}-debug.apk" \;
          test -s "../../dist/NFSMWPC-AndroidEvolved-${{ matrix.abi }}-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NFSMWPC-AndroidEvolved-${{ matrix.abi }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14
